stages:
  - lint
  - test
  - build
  - plan
  - apply

variables:
  TF_ROOT: ${CI_PROJECT_DIR}/infra
  TF_STATE_BUCKET: fleet-terraform-state
  TF_STATE_REGION: us-east-1

.terraform_base:
  image: hashicorp/terraform:1.5
  before_script:
    - cd ${TF_ROOT}
    - terraform --version

# Combined template: Terraform image + OIDC auth without requiring aws CLI.
# AWS SDK picks up AWS_WEB_IDENTITY_TOKEN_FILE + AWS_ROLE_ARN natively.
.terraform_aws_base:
  image: hashicorp/terraform:1.5
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - cd ${TF_ROOT}
    - echo "${GITLAB_OIDC_TOKEN}" > /tmp/web_identity_token
    - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/web_identity_token
    - export AWS_ROLE_SESSION_NAME=gitlab-${CI_PIPELINE_ID}
    - terraform --version

# MR Pipeline: Lint and Test
terraform:lint:
  stage: lint
  extends: .terraform_base
  script:
    - terraform fmt -check -recursive
    - terraform init -backend=false
    - terraform validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

python:lint:
  stage: lint
  image: python:3.11
  script:
    - pip install -e ".[dev]" mypy
    - ruff check src/ tests/
    - mypy src/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

python:test:
  stage: test
  image: python:3.11
  script:
    - pip install -e ".[dev]"
    - pytest tests/ --cov=src --cov-report=term --cov-report=xml
    - |
      COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); print(float(tree.getroot().attrib['line-rate']) * 100)")
      if (( $(echo "$COVERAGE < 80" | bc -l) )); then
        echo "Coverage $COVERAGE% is below 80% threshold"
        exit 1
      fi
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.build_lambda: &build_lambda
  - mkdir -p dist/pkg
  - pip install . --target dist/pkg --quiet
  - python scripts/build_lambda_zip.py dist/pkg dist/fleet_telemetry.zip
  - echo "Lambda package built at dist/fleet_telemetry.zip"

# Staging Pipeline: Build and Deploy
build:staging:
  stage: build
  image: python:3.11
  script:
    - *build_lambda
  artifacts:
    paths:
      - dist/fleet_telemetry.zip
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: staging

terraform:plan:staging:
  stage: plan
  extends: .terraform_aws_base
  variables:
    AWS_ROLE_ARN: arn:aws:iam::${AWS_ACCOUNT_ID}:role/GitLabOIDC-staging
  script:
    - terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=staging/terraform.tfstate" -backend-config="region=${TF_STATE_REGION}" -backend-config="encrypt=true"
    - terraform plan -var-file=environments/staging.tfvars -var "lambda_package_path=${CI_PROJECT_DIR}/dist/fleet_telemetry.zip" -out=staging.tfplan
  artifacts:
    paths:
      - ${TF_ROOT}/staging.tfplan
    expire_in: 1 day
  needs:
    - build:staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: staging

terraform:apply:staging:
  stage: apply
  extends: .terraform_aws_base
  variables:
    AWS_ROLE_ARN: arn:aws:iam::${AWS_ACCOUNT_ID}:role/GitLabOIDC-staging
  script:
    - terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=staging/terraform.tfstate" -backend-config="region=${TF_STATE_REGION}" -backend-config="encrypt=true"
    - terraform apply -auto-approve staging.tfplan
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: staging
  needs:
    - job: build:staging
      artifacts: true
    - job: terraform:plan:staging
      artifacts: true

# Production Pipeline: Manual Gate
build:production:
  stage: build
  image: python:3.11
  script:
    - *build_lambda
  artifacts:
    paths:
      - dist/fleet_telemetry.zip
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG
  environment:
    name: production

terraform:plan:production:
  stage: plan
  extends: .terraform_aws_base
  variables:
    AWS_ROLE_ARN: arn:aws:iam::${AWS_ACCOUNT_ID}:role/GitLabOIDC-production
  script:
    - terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=production/terraform.tfstate" -backend-config="region=${TF_STATE_REGION}" -backend-config="encrypt=true"
    - terraform plan -var-file=environments/production.tfvars -var "lambda_package_path=${CI_PROJECT_DIR}/dist/fleet_telemetry.zip" -out=production.tfplan
  artifacts:
    paths:
      - ${TF_ROOT}/production.tfplan
    expire_in: 7 days
  needs:
    - build:production
  rules:
    - if: $CI_COMMIT_TAG
  environment:
    name: production

terraform:apply:production:
  stage: apply
  extends: .terraform_aws_base
  variables:
    AWS_ROLE_ARN: arn:aws:iam::${AWS_ACCOUNT_ID}:role/GitLabOIDC-production
  script:
    - terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=production/terraform.tfstate" -backend-config="region=${TF_STATE_REGION}" -backend-config="encrypt=true"
    - terraform apply -auto-approve production.tfplan
  rules:
    - if: $CI_COMMIT_TAG
  when: manual
  environment:
    name: production
  needs:
    - job: terraform:plan:production
      artifacts: true
