[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-telemetry"
version = "0.1.0"
description = "Fleet telemetry U1 core"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "bandit>=1.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests/u1_telemetry_core", "tests/u3_daily_reporting", "tests/u4_integrated_packaging", "tests/u2_fleet_access"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["fleet_telemetry.telemetry_core", "fleet_telemetry.daily_reporting", "fleet_telemetry.fleet_access"]
omit = ["*/fleet_access/lambda_invoke.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.bandit]
exclude_dirs = ["tests"]
severity = "medium"
confidence = "medium"

[tool.mypy]
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]
